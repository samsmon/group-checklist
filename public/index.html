<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Group Checklist</title>
  <link rel="stylesheet" href="/css/vars.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/items.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/panels.css" />
  <link rel="stylesheet" href="/css/mobile.css" />
</head>
<body x-data="app" x-init="init()" x-cloak @keydown.escape.window="handleEscape()">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
      <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></symbol>
      <symbol id="i-tree" viewBox="0 0 24 24"><polyline points="3 8 7 12 3 16"/><line x1="21" y1="12" x2="11" y2="12"/><line x1="21" y1="6" x2="11" y2="6"/><line x1="21" y1="18" x2="11" y2="18"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
      <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
      <symbol id="i-comment" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></symbol>
      <symbol id="i-select" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol>
      <symbol id="i-arrow-up" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol>
      <symbol id="i-arrow-down" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></symbol>
      <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
    </defs>
  </svg>

  <div class="loading-screen" x-show="loading">Loading...</div>

  <!-- Auth page -->
  <div class="auth-page" x-show="!loading && !user && !activeProject">
    <div class="auth-card">
      <h2 x-text="authMode === 'login' ? 'Sign in' : 'Create account'"></h2>
      <p class="auth-sub">Group Checklist</p>
      <div class="form-group">
        <label>Username</label>
        <input type="text" x-model="authForm.username" maxlength="32" @keyup.enter="submitAuth()" placeholder="username" autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" x-model="authForm.password" maxlength="128" @keyup.enter="submitAuth()" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <p class="error-msg" x-show="authError" x-text="authError"></p>
      <button class="btn btn-primary btn-block" style="margin-top:8px" @click="submitAuth()" :disabled="authLoading">
        <span x-text="authLoading ? 'Please wait...' : (authMode === 'login' ? 'Sign in' : 'Create account')"></span>
      </button>
      <p class="auth-switch">
        <span x-show="authMode === 'login'">No account? <a @click="authMode='register'; authError=''">Register</a></span>
        <span x-show="authMode === 'register'">Already have one? <a @click="authMode='login'; authError=''">Sign in</a></span>
      </p>
    </div>
  </div>

  <!-- Main layout -->
  <div class="layout" x-show="!loading && (user || activeProject)">

    <!-- Mobile sidebar overlay — display managed by x-show only, no inline style -->
    <div class="mobile-overlay" x-show="mobileSidebarOpen" @click="mobileSidebarOpen = false"></div>

    <!-- Sidebar -->
    <aside class="sidebar" :class="{ collapsed: !sidebarOpen, 'mobile-open': mobileSidebarOpen }">
      <!-- Mobile sidebar header -->
      <div class="mobile-sidebar-header" x-show="mobileSidebarOpen" style="display:flex;align-items:center;padding:12px 12px 8px;gap:8px;border-bottom:0.5px solid var(--border);flex-shrink:0;">
        <div class="sidebar-brand" style="flex:1;">Group Checklist</div>
        <button class="btn-link" @click="toggleTheme()" :title="isDark ? 'Switch to light' : 'Switch to dark'" :aria-label="isDark ? 'Switch to light theme' : 'Switch to dark theme'" style="font-size:16px;">
          <svg class="icon" aria-hidden="true"><use :href="isDark ? '#i-sun' : '#i-moon'"/></svg>
        </button>
        <button class="btn-link" @click="mobileSidebarOpen = false" aria-label="Close menu" style="font-size:18px;padding:2px 4px;"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
      <div class="sidebar-toggle-row">
        <button class="btn-link" @click="sidebarOpen = !sidebarOpen" :title="sidebarOpen ? 'Collapse' : 'Expand'" style="font-size:17px;flex-shrink:0;padding:0 2px;">
          <span x-text="sidebarOpen ? '‹' : '›'"></span>
        </button>
        <div class="sidebar-brand" x-show="sidebarOpen">Group Checklist</div>
        <button class="btn-link" @click="toggleTheme()" x-show="sidebarOpen" :title="isDark ? 'Switch to light' : 'Switch to dark'" :aria-label="isDark ? 'Switch to light theme' : 'Switch to dark theme'" style="font-size:16px;line-height:1;padding:3px;margin-left:auto;">
          <svg class="icon" aria-hidden="true"><use :href="isDark ? '#i-sun' : '#i-moon'"/></svg>
        </button>
      </div>
      <div class="sidebar-inner" x-show="sidebarOpen || mobileSidebarOpen">

      <div style="padding: 6px 16px 0;">
        <button class="btn-new-project" @click="openModal('createProject')" x-show="user">
          New project
        </button>
      </div>

      <div class="sidebar-projects">
        <template x-if="user">
          <div>
            <div class="sidebar-home-item" :class="{ active: !activeProject }" @click="goHome(); mobileSidebarOpen = false">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Home
            </div>
            <div class="sidebar-section-label">Projects</div>
            <template x-for="p in projects" :key="p.id">
              <div class="project-item" :class="{active: activeProject?.slug === p.slug}" @click="selectProject(p.slug)">
                <span class="project-item-name" x-text="p.name"></span>
                <span class="badge-vis" :class="p.visibility === 'public' ? 'badge-public' : 'badge-private'" x-text="p.visibility === 'public' ? 'pub' : 'priv'"></span>
              </div>
            </template>
            <div style="padding: 12px 10px; color: var(--text-muted); font-size: 12px;" x-show="projects.length === 0">
              No projects yet.
            </div>
          </div>
        </template>
        <template x-if="!user && activeProject">
          <div style="padding: 10px; color: var(--text-muted); font-size: 12px; line-height: 1.6;">
            Viewing shared project.<br>
            <a href="#" style="color: var(--accent);" @click.prevent="authMode='login'; openModal('auth')">Sign in</a> to manage your own.
          </div>
        </template>
      </div>

      <div class="sidebar-footer">
        <template x-if="user">
          <div class="user-info">
            <div class="user-avatar" x-text="user.username[0].toUpperCase()"></div>
            <span class="user-name" x-text="user.username"></span>
            <button class="btn-link" title="Sign out" aria-label="Sign out" @click="logout()" style="font-size:15px;"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg></button>
          </div>
        </template>
        <template x-if="!user">
          <div style="font-size:12px; color: var(--text-muted);">
            Guest: <span x-text="guestName || 'not set'"></span>
            <button class="btn-link" style="margin-left:4px;" @click="openModal('guestName')">change</button>
          </div>
        </template>
      </div>
      </div><!-- /sidebarOpen -->
    </aside>

    <!-- Main -->
    <div class="main">

      <!-- Guest landing -->
      <div class="empty-state" x-show="!activeProject && !user">
        <p>Open a shared project link to get started.</p>
      </div>

      <!-- Dashboard mobile topbar (only visible on mobile, when no project open) -->
      <div class="mobile-topbar" x-show="!activeProject && !!user" style="justify-content:space-between;">
        <button class="mobile-hamburger" @click="mobileSidebarOpen = true" aria-label="Open menu"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button>
        <span class="mobile-topbar-title">Projects</span>
        <button class="btn-new-dash" @click="openModal('createProject')">New project</button>
      </div>

      <!-- Dashboard (logged-in, no project selected) -->
      <div class="dashboard" x-show="!activeProject && !!user">
        <div class="dash-inner">

          <h1 class="dash-title">Projects</h1>

          <div class="dash-section-hdr" x-show="projects.length > 0">
            <button class="dash-new-btn" @click="openModal('createProject')">New project</button>
          </div>

          <template x-if="projects.length === 0">
            <div class="dash-empty">
              <div class="dash-empty-title">No projects yet</div>
              <div class="dash-empty-sub">Create a checklist and share the link with your group.</div>
              <button class="btn btn-primary" @click="openModal('createProject')">New project</button>
            </div>
          </template>

          <table class="dash-table" x-show="projects.length > 0">
            <thead><tr><th>Name</th><th>Progress</th><th>Last activity</th><th>Access</th></tr></thead>
            <tbody>
              <template x-for="p in projects" :key="p.id">
                <tr>
                  <td class="dash-name"><a :href="'#/p/' + p.slug" x-text="p.name"></a></td>
                  <td class="dash-prog"><span class="mini"><i :style="{ width: (p.item_count > 0 ? Math.round(p.completed_count / p.item_count * 100) : 0) + '%' }"></i></span><span x-text="(p.completed_count || 0) + '/' + (p.item_count || 0)"></span></td>
                  <td class="dash-meta" x-text="relTime(p.last_activity_at)"></td>
                  <td class="dash-meta" x-text="p.visibility"></td>
                </tr>
              </template>
            </tbody>
          </table>

        </div>
      </div>

      <template x-if="activeProject">
        <div style="display:flex;flex-direction:column;height:100%;overflow:hidden;">

          <!-- Click-outside backdrop for project menu -->
          <div x-show="showProjectMenu" @click="showProjectMenu = false"
               style="position:fixed;inset:0;z-index:49;" aria-hidden="true"></div>

          <!-- Project settings dropdown (shared between mobile/desktop) -->
          <div x-show="showProjectMenu" class="project-menu-dropdown">
            <button class="project-menu-item" @click="showProjectMenu = false; openModal('export')"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg> Export</button>
            <button class="project-menu-item" @click="showProjectMenu = false; copyLink()"><svg class="icon" aria-hidden="true"><use href="#i-link"/></svg> Copy link</button>
            <button class="project-menu-item" @click="showProjectMenu = false; toggleViewMode()">
              <svg class="icon" aria-hidden="true"><use :href="viewMode === 'tree' ? '#i-list' : '#i-tree'"/></svg>
              <span x-text="viewMode === 'tree' ? 'Flat view' : 'Tree view'"></span>
            </button>
            <button x-show="activeProject.is_owner" class="project-menu-item" @click="showProjectMenu = false; toggleVisibility()">
              <svg class="icon" aria-hidden="true"><use :href="activeProject.visibility === 'public' ? '#i-lock' : '#i-globe'"/></svg>
              <span x-text="activeProject.visibility === 'public' ? 'Make private' : 'Make public'"></span>
            </button>
            <div x-show="activeProject.is_owner" class="project-menu-divider"></div>
            <button x-show="activeProject.is_owner" class="project-menu-item danger" @click="showProjectMenu = false; openDeleteProjectModal()">
              <svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg> Delete project
            </button>
          </div>

          <!-- Mobile top bar -->
          <div class="mobile-topbar">
            <button class="mobile-home-btn" @click="goHome()" title="Home" aria-label="Go to dashboard">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            </button>
            <span class="mobile-topbar-title" x-text="activeProject.name"></span>
            <span class="conn-status" x-show="wsOffline" role="status">offline</span>

            <!-- Normal mode -->
            <template x-if="!deleteMode">
              <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
                <button x-show="viewMode === 'tree' && items.some(i => i.item_type === 'section')"
                        class="mobile-panel-tab"
                        @click="toggleAllSections()"
                        :title="allSectionsCollapsed() ? 'Expand all sections' : 'Collapse all sections'"
                        :aria-label="allSectionsCollapsed() ? 'Expand all sections' : 'Collapse all sections'"
                        style="padding:4px 8px;font-size:13px;">
                  <svg class="icon" aria-hidden="true"><use :href="allSectionsCollapsed() ? '#i-chevron-right' : '#i-chevron-down'"/></svg>
                </button>
                <div class="mobile-panel-tabs">
                  <button class="mobile-panel-tab" :class="{ active: mobilePanel === 'items' }" @click="mobilePanel = 'items'">Items</button>
                  <button class="mobile-panel-tab" :class="{ active: mobilePanel === 'chat' }" @click="mobilePanel = 'chat'">Chat</button>
                </div>
                <button class="btn-link" :class="{ 'pmenu-active': showProjectMenu }"
                        @click="showProjectMenu = !showProjectMenu" title="Project menu" aria-label="Project menu"
                        style="font-size:17px;padding:4px 8px;border-radius:6px;"><svg class="icon" aria-hidden="true"><use href="#i-more"/></svg></button>
              </div>
            </template>

            <!-- Delete mode -->
            <template x-if="deleteMode">
              <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
                <button class="mobile-panel-tab" @click="allSelected() ? deselectAll() : selectAll()"
                        x-text="allSelected() ? 'Deselect all' : 'Select all'" style="font-size:11px;padding:4px 8px;"></button>
                <button class="mobile-panel-tab" @click="openModal('batchDelete')" :disabled="selectedCount() === 0"
                        style="font-size:11px;padding:4px 8px;color:var(--danger);">Delete</button>
                <button class="mobile-panel-tab" @click="toggleDeleteMode()" aria-label="Cancel selection" style="font-size:12px;padding:4px 8px;"><svg class="icon" aria-hidden="true"><use href="#i-x"/></svg></button>
              </div>
            </template>
          </div>

          <!-- Header -->
          <div class="main-header">
            <div class="main-header-top">
              <h1 class="main-title" x-text="activeProject.name"></h1>

              <!-- Normal mode actions -->
              <div x-show="!deleteMode" class="header-actions">
                <span class="conn-status" x-show="wsOffline" role="status">reconnecting…</span>
                <button
                  x-show="viewMode === 'tree' && items.some(i => i.item_type === 'section')"
                  class="header-btn"
                  @click="toggleAllSections()"
                  x-text="allSectionsCollapsed() ? 'Expand all' : 'Collapse all'">
                </button>
                <button x-show="activeProject.is_owner" class="header-btn" @click="toggleDeleteMode()"><svg class="icon" aria-hidden="true"><use href="#i-select"/></svg> Select</button>
                <span class="header-visibility-badge">
                  <svg class="icon" aria-hidden="true"><use :href="activeProject.visibility === 'public' ? '#i-globe' : '#i-lock'"/></svg><span x-text="activeProject.visibility === 'public' ? 'Public' : 'Private'"></span>
                </span>
                <button class="header-btn" :class="{ active: showProjectMenu }" @click="showProjectMenu = !showProjectMenu" aria-haspopup="menu" :aria-expanded="showProjectMenu">
                  Project <svg class="icon" aria-hidden="true"><use href="#i-chevron-down"/></svg>
                </button>
              </div>

              <!-- Delete mode actions -->
              <div x-show="deleteMode" class="header-actions">
                <button class="header-btn" @click="allSelected() ? deselectAll() : selectAll()"
                        x-text="allSelected() ? 'Deselect all' : 'Select all'"></button>
                <span x-text="selectedCount() + ' selected'" style="font-size:12px;color:var(--text-muted);"></span>
                <button class="header-btn" @click="openModal('batchDelete')" :disabled="selectedCount() === 0"
                        style="color:var(--danger);border-color:var(--danger);">Delete</button>
                <button class="header-btn" @click="toggleDeleteMode()">Cancel</button>
              </div>
            </div>
            <p class="progress-label" x-text="doneCount + ' of ' + taskItems.length + ' done' + (taskItems.length ? ' · ' + progressPct + '%' : '')"></p>
            <div class="progress-bar-wrap" role="progressbar" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="progressPct">
              <div class="progress-bar" :style="{ width: progressPct + '%' }"></div>
            </div>
          </div>

          <!-- Body: items + right panel -->
          <div class="content-panels" :class="{ 'show-chat': mobilePanel === 'chat' }" style="flex:1;display:flex;overflow:hidden;">
          <div class="main-content" style="flex:1;">
            <div class="items-wrap">

              <template x-for="(item, index) in items" :key="item.id">
                <div
                  x-show="item.item_type === 'section' || viewMode === 'flat' || !sectionMap[item.id] || !collapsedSections[sectionMap[item.id]]"
                  :class="{
                    'item': item.item_type !== 'section',
                    'section-item': item.item_type === 'section',
                    'done': item.item_type !== 'section' && !!item.completion,
                    'tree-child': viewMode === 'tree' && item.item_type !== 'section' && !!sectionMap[item.id],
                    'dragging': activeProject.is_owner && !deleteMode && draggingIndex === index,
                    'drag-over': activeProject.is_owner && !deleteMode && dragOverIndex === index && draggingIndex !== index
                  }"
                  :draggable="activeProject.is_owner && !deleteMode"
                  @dragstart="activeProject.is_owner && !deleteMode && dragStart($event, index)"
                  @dragover.prevent="activeProject.is_owner && !deleteMode && dragOver($event, index)"
                  @drop.prevent="activeProject.is_owner && !deleteMode && drop($event, index)"
                  @dragend="dragEnd()"
                >
                  <!-- Section header -->
                  <template x-if="item.item_type === 'section'">
                    <div class="section-inner">
                      <input x-show="deleteMode" type="checkbox" class="delete-checkbox"
                             :checked="!!selectedItems[item.id]" @change="toggleSelectItem(item)" @click.stop />
                      <button x-show="viewMode === 'tree' && !deleteMode" class="section-collapse-btn"
                              @click.stop="toggleSection(item.id)" :title="collapsedSections[item.id] ? 'Expand section' : 'Collapse section'"
                              :aria-label="collapsedSections[item.id] ? 'Expand section' : 'Collapse section'" :aria-expanded="!collapsedSections[item.id]">
                        <svg class="icon chevron" :class="{ open: !collapsedSections[item.id] }" aria-hidden="true"><use href="#i-chevron-right"/></svg>
                      </button>
                      <span class="drag-handle" x-show="activeProject.is_owner && !deleteMode" title="Drag to reorder">⣿</span>
                      <div class="section-body">
                        <div class="section-title" x-text="item.title"></div>
                        <div class="section-caption" x-show="item.description" x-text="item.description"></div>
                        <div x-show="viewMode === 'tree'" class="section-progress-line">
                          <span class="section-progress-text"
                                x-text="getSectionProgress(item.id).done + '/' + getSectionProgress(item.id).total + ' done'"></span>
                          <div class="section-progress-bar-wrap">
                            <div class="section-progress-bar"
                                 :style="{ width: getSectionProgress(item.id).pct + '%' }"></div>
                          </div>
                        </div>
                      </div>
                      <div class="section-actions" x-show="activeProject.is_owner && !deleteMode">
                        <button class="btn-icon" @click.stop="openEditItemModal(item)" title="Edit" aria-label="Edit"><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg></button>
                        <button class="btn-icon danger" @click.stop="openDeleteItemModal(item)" title="Delete" aria-label="Delete"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg></button>
                      </div>
                    </div>
                  </template>

                  <!-- Task item -->
                  <template x-if="!item.item_type || item.item_type === 'task'">
                    <div>
                      <div class="item-main">
                        <input x-show="deleteMode" type="checkbox" class="delete-checkbox"
                               :checked="!!selectedItems[item.id]" @change="toggleSelectItem(item)" @click.stop />
                        <span class="drag-handle" x-show="activeProject.is_owner && !deleteMode" title="Drag to reorder">⣿</span>

                        <button
                          type="button"
                          class="checkbox"
                          role="checkbox"
                          x-show="!deleteMode"
                          :aria-checked="!!item.completion"
                          :aria-label="(item.completion ? 'Undo completion: ' : 'Mark as complete: ') + item.title"
                          @click="quickToggle(item)"
                          :title="item.completion ? 'Undo completion' : 'Mark as complete'"
                        >
                          <svg class="icon checkmark" x-show="item.completion" aria-hidden="true"><use href="#i-check"/></svg>
                        </button>

                        <div class="item-body">
                          <div class="item-text" x-text="item.title"></div>
                          <div x-show="item.description" class="item-desc-wrap">
                            <div class="item-desc" x-text="item.description"></div>
                            <button class="copy-desc-btn" @click.stop="copyDescription(item.description)" title="Copy description" aria-label="Copy description"><svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg></button>
                          </div>
                        </div>

                        <div class="item-actions" x-show="activeProject.is_owner && !deleteMode">
                          <button class="btn-icon" @click.stop="moveItem(index, -1)" :disabled="index === 0" title="Move up" aria-label="Move up"><svg class="icon" aria-hidden="true"><use href="#i-arrow-up"/></svg></button>
                          <button class="btn-icon" @click.stop="moveItem(index, 1)" :disabled="index === items.length - 1" title="Move down" aria-label="Move down"><svg class="icon" aria-hidden="true"><use href="#i-arrow-down"/></svg></button>
                          <button class="btn-icon" @click.stop="openEditItemModal(item)" title="Edit" aria-label="Edit"><svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg></button>
                          <button class="btn-icon danger" @click.stop="openDeleteItemModal(item)" title="Delete" aria-label="Delete"><svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg></button>
                        </div>
                      </div>

                      <div class="item-footer" x-show="!deleteMode">
                        <div class="footer-field">
                          <span class="footer-label">PIC:</span>
                          <template x-for="pic in item.pics" :key="pic.id">
                            <span class="pic-chip">
                              <span x-text="pic.name"></span>
                              <button x-show="activeProject.is_owner" @click.stop="removePic(item, pic)" title="Remove">×</button>
                            </span>
                          </template>
                          <button class="assign-btn" @click.stop="activeProject.is_owner ? openAddPicModal(item) : openNonOwnerPic(item)">
                            <span x-text="activeProject.is_owner ? '+ add' : 'assign'"></span>
                          </button>
                        </div>
                        <div class="footer-field">
                          <span class="footer-label">Done by:</span>
                          <template x-if="item.completion">
                            <span class="done-name" x-text="item.completion.done_by_name"></span>
                          </template>
                          <template x-if="item.completion">
                            <span class="done-time" x-text="new Date(item.completion.completed_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' · ' + new Date(item.completion.completed_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})"></span>
                          </template>
                          <template x-if="item.completion">
                            <button class="assign-btn" @click.stop="activeProject.is_owner ? openCompleteModal(item) : openNonOwnerComplete(item)"
                                    title="Edit who finished this, or add a note">edit</button>
                          </template>
                          <template x-if="!item.completion">
                            <span class="done-empty">-</span>
                          </template>
                        </div>
                        <button class="comment-icon-btn" @click.stop="openCommentPopup(item, $event)" title="Comments" aria-label="Comments"><svg class="icon" aria-hidden="true"><use href="#i-comment"/></svg></button>
                      </div>
                    </div>
                  </template>

                </div>
              </template>


              <div class="items-empty" x-show="items.length === 0">
                <p x-text="activeProject.is_owner ? 'This checklist is empty.' : 'Nothing here yet.'"></p>
                <p class="items-empty-sub" x-show="activeProject.is_owner">Add a task or section below, or import a Markdown or CSV file.</p>
              </div>

              <template x-if="activeProject.is_owner && !deleteMode">
                <div class="items-toolbar">
                  <input type="text" class="quick-add-input" x-model="quickAddText" maxlength="200"
                         aria-label="Add a task" placeholder="Add a task. Paste several lines to add them all."
                         :disabled="quickAddBusy" @keydown.enter.prevent="quickAdd()" @paste="onQuickPaste($event)" />
                  <button class="btn-import" @click="openModal('addItem')" title="Add a section, or a task with a description">More options</button>
                  <button class="btn-import" @click="openModal('import')" title="Bulk import from Markdown or CSV"><svg class="icon" aria-hidden="true"><use href="#i-download"/></svg> Import</button>
                </div>
              </template>

            </div>
          </div>

          <!-- Right panel: chat + log -->
          <div class="right-panel">
            <div class="rp-header">
              <div class="rp-tabs">
                <button class="rp-tab" :class="{ active: rightTab === 'chat' }" @click="rightTab = 'chat'">Chat</button>
                <template x-if="activeProject.is_owner">
                  <button class="rp-tab" :class="{ active: rightTab === 'log' }" @click="rightTab = 'log'; loadLogs()">Log</button>
                </template>
              </div>
            </div>
            <!-- Chat tab -->
            <template x-if="rightTab === 'chat'">
              <div style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
                <div id="chat-messages" style="flex:1;overflow-y:auto;">
                  <div class="chat-list">
                    <div class="rp-empty" x-show="messagesLoading">Loading…</div>
                    <div class="rp-empty" x-show="!messagesLoading && messages.length === 0">No messages yet. Say hi!</div>
                    <template x-for="msg in messages" :key="msg.id">
                      <div>
                        <div class="chat-msg-meta">
                          <span class="chat-sender" x-text="msg.sender_name"></span>
                          <span class="chat-ts" x-text="new Date(msg.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' · ' + new Date(msg.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})"></span>
                        </div>
                        <div class="chat-body" x-text="msg.body"></div>
                      </div>
                    </template>
                  </div>
                </div>
                <template x-if="!user">
                  <div style="padding:8px 12px 10px;font-size:12px;color:var(--text-muted);text-align:center;border-top:0.5px solid var(--border);">
                    <a @click.prevent="authMode='login'; openModal('auth')" style="color:var(--accent);cursor:pointer;">Sign in</a> to send messages.
                  </div>
                </template>
                <template x-if="user">
                  <div class="chat-input-wrap">
                    <input class="chat-input" type="text" aria-label="Message" x-model="messageInput" maxlength="2000" @keyup.enter="sendMessage()" placeholder="Message…" />
                    <button class="chat-send" @click="sendMessage()" :disabled="!messageInput.trim()" aria-label="Send message"><svg class="icon" aria-hidden="true"><use href="#i-send"/></svg></button>
                  </div>
                </template>
              </div>
            </template>
            <!-- Log tab (owner only) -->
            <template x-if="rightTab === 'log' && activeProject.is_owner">
              <div style="flex:1;overflow-y:auto;">
                <div class="rp-empty" x-show="logsLoading">Loading…</div>
                <div class="rp-empty" x-show="!logsLoading && logsData.length === 0">No activity yet.</div>
                <template x-for="entry in logsData" :key="entry.id">
                  <div class="log-entry">
                    <div><span class="log-actor" x-text="entry.actor_name"></span><span class="log-desc" x-text="' ' + formatLogAction(entry.action)"></span></div>
                    <div class="log-ts" x-text="new Date(entry.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short'}) + ' · ' + new Date(entry.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})"></div>
                  </div>
                </template>
              </div>
            </template>
          </div>
          </div><!-- /body flex -->

        </div>
      </template>

    </div>
  </div>

  <!-- Modals, popups & toast — HTML injected from js/modals.js at alpine:init -->
  <div id="modals-mount"></div>

  <script src="/js/api.js"></script>
  <script src="/js/modals.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/projects.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/items.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/export.js"></script>
  <script src="/app.js"></script>
  <script defer src="/vendor/alpine-3.17.4.min.js"></script>
</body>
</html>
