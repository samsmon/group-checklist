# /etc/nginx/sites-available/group-checklist

# Real client address: Cloudflare sets CF-Connecting-IP; fall back to the socket address
# for direct hits. Used to overwrite (not append to) X-Forwarded-For so clients cannot spoof it.
map $http_cf_connecting_ip $gc_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

# Redirect bare HTTP → HTTPS (Cloudflare handles public HTTPS; this covers direct EC2 access)
server {
    listen 80;
    server_name checky.suryatmaja.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name checky.suryatmaja.dev;

    # Cloudflare Origin Certificate (install via: docs/deploy-ec2.md step 3)
    ssl_certificate     /etc/ssl/cloudflare/cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $gc_client_ip;
        proxy_set_header X-Forwarded-For $gc_client_ip;
        proxy_set_header Fly-Client-IP "";   # only trusted when set by Fly's own proxy
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
