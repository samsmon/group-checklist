services:
  group-checklist:
    build: .
    container_name: group-checklist
    restart: unless-stopped
    env_file: .env
    mem_limit: 512m
    # /health answers 503 when the database is unreachable
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 8080) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    ports:
      - "3001:8080"
    networks:
      - default
      - shared_net
networks:
  shared_net:
    external: true
